services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-orchestrator-v1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ../:/workspace
      - ../certs:/certs:ro
      - ${HOST_GH_CONFIG_DIR:-./.auth/gh}:/root/.config/gh
      - ${HOST_CODEX_CONFIG_DIR:-./.auth/codex}:/root/.codex
      - ${HOST_GEMINI_CONFIG_DIR:-./.auth/gemini}:/root/.config/gemini
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
      - PYTHONIOENCODING=UTF-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - WORKSPACE_DIR=${WORKSPACE_DIR:-/workspace}
      - RAG_DIR=${RAG_DIR:-/workspace}
      - RAG_MAX_SCAN_FILES=${RAG_MAX_SCAN_FILES:-400}
      - SPEC_PATH=${SPEC_PATH:-/workspace/design_spec.json}
      - MVP_OUTPUT_DIR=${MVP_OUTPUT_DIR:-/app/data/mvp_runs}
      - CLI_TIMEOUT_SEC=${CLI_TIMEOUT_SEC:-900}
      - CLI_AUTH_TIMEOUT_SECONDS=${CLI_AUTH_TIMEOUT_SECONDS:-8}
      - DOCKER_CONTAINER_NAME=${DOCKER_CONTAINER_NAME:-web-orchestrator-v1}
      - TLS_CA_CERT_FILE=${TLS_CA_CERT_FILE:-/certs/eprism.pem}
      - NODE_EXTRA_CA_CERTS=${TLS_CA_CERT_FILE:-/certs/eprism.pem}
      - SSL_CERT_FILE=${TLS_CA_CERT_FILE:-/certs/eprism.pem}
      - REQUESTS_CA_BUNDLE=${TLS_CA_CERT_FILE:-/certs/eprism.pem}
      - GEMINI_CLI_CMD=${GEMINI_CLI_CMD:-gemini --prompt {prompt} --yolo}
      - CODEX_CLI_CMD=${CODEX_CLI_CMD:-codex exec --skip-git-repo-check --full-auto {prompt}}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_PARENT_PAGE_ID=${NOTION_PARENT_PAGE_ID:-}
    restart: unless-stopped
