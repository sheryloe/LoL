<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoL 협업 오케스트레이터</title>
  <style>
    :root {
      --bg: #f4efe5;
      --surface: #fffdf7;
      --surface-alt: #f8f2e8;
      --ink: #1f2a30;
      --muted: #66727b;
      --line: #d8d0c2;
      --accent: #0e7a5f;
      --accent-2: #d99233;
      --accent-3: #1f5f85;
      --danger: #b53a3a;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard Variable", "SUIT Variable", "IBM Plex Sans KR", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 480px at 85% -20%, #ffe2b7 0%, transparent 55%),
        radial-gradient(900px 420px at -5% -20%, #d9f0e7 0%, transparent 50%),
        linear-gradient(160deg, var(--bg) 0%, #ece5d8 100%);
      color: var(--ink);
      letter-spacing: 0.01em;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      background-image:
        linear-gradient(45deg, rgba(14, 122, 95, 0.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(14, 122, 95, 0.08) 25%, transparent 25%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
    }
    .card {
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-alt) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 12px 32px rgba(33, 43, 48, 0.08);
      animation: riseIn 220ms ease-out;
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      padding: 8px 10px;
      border: 1px solid #d9d0bf;
      border-radius: 12px;
      background: #fff6e6;
    }
    .hero .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid #e8cfa1;
      background: #fff;
      color: #8b5a18;
      font-size: 12px;
      font-weight: 700;
    }
    .hero .small {
      color: #6d5a39;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
    }
    .title {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 800;
    }
    .subtitle {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stack { display: grid; gap: 10px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }
    input, textarea, button, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    input, textarea, select { transition: box-shadow 0.15s ease, border-color 0.15s ease; }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #5fae95;
      box-shadow: 0 0 0 3px rgba(14, 122, 95, 0.12);
    }
    textarea { min-height: 90px; resize: vertical; }
    .btn {
      background: linear-gradient(140deg, #0f8f6f, var(--accent));
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12); }
    .btn:active { transform: translateY(0); box-shadow: none; }
    .btn.secondary { background: linear-gradient(140deg, #2f6a55, #244f41); }
    .btn.ghost {
      background: #fffaf0;
      color: #204f40;
      border: 1px solid #d9cbb1;
    }
    .btn.danger { background: linear-gradient(140deg, #cf4a4a, var(--danger)); }
    .status {
      font-size: 12px;
      color: #3d4a52;
      min-height: 20px;
      border-left: 4px solid var(--accent-2);
      background: #fff7ea;
      border-radius: 8px;
      padding: 8px 10px;
      line-height: 1.45;
    }
    .logs, .panel-content, .file-content {
      background: #fffaf2;
      border: 1px solid #d9d0c0;
      border-radius: 10px;
      padding: 10px;
      white-space: pre-wrap;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 12px;
      overflow: auto;
      line-height: 1.45;
    }
    .logs { min-height: 280px; max-height: 380px; }
    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .panel-title {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #31434b;
      border-left: 4px solid var(--accent-3);
      padding-left: 6px;
      font-weight: 700;
    }
    .panel-content {
      min-height: 100px;
      max-height: 220px;
    }
    .project-list {
      border: 1px solid #d9d0bf;
      border-radius: 10px;
      background: #fffaf2;
      max-height: 200px;
      overflow: auto;
    }
    .project-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #e9e3d7;
      cursor: pointer;
      font-size: 12px;
    }
    .project-row:last-child { border-bottom: none; }
    .project-row:hover { background: #f5ecde; }
    .project-row .muted { color: var(--muted); }
    .files-list {
      border: 1px solid #d9d0bf;
      border-radius: 10px;
      background: #fffaf2;
      max-height: 220px;
      overflow: auto;
    }
    .entry {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid #e9e3d7;
      cursor: pointer;
      font-size: 12px;
    }
    .entry:hover { background: #f5ecde; }
    .entry:last-child { border-bottom: none; }
    .entry .type { color: var(--muted); }
    .checkline {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      font-size: 12px;
      color: #3e4a52;
      font-weight: 600;
    }
    .checkline input { width: auto; accent-color: var(--accent); }
    .file-content { min-height: 180px; max-height: 320px; }
    @media (max-width: 1080px) {
      .wrap { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .hero { flex-direction: column; align-items: flex-start; }
      .hero .small { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card stack">
      <div class="hero">
        <div class="badge">실시간 협업 워크플로</div>
        <div class="small">UTF-8 · 한국어 UI · Docker 실실행 기준</div>
      </div>
      <h1 class="title">워크플로 콘솔</h1>
      <p class="subtitle">채팅방 = 프로젝트 단위로 계획, 구현, 리뷰, 수정 단계를 실행합니다.</p>

      <div class="grid-3">
        <div>
          <label for="projectId">프로젝트 ID (채팅방 ID)</label>
          <input id="projectId" value="room-main" />
        </div>
        <div>
          <label for="sessionId">세션 ID</label>
          <input id="sessionId" value="room-main" />
        </div>
        <div>
          <label for="cwdRelative">작업 경로 (상대)</label>
          <input id="cwdRelative" value="." />
        </div>
      </div>

      <div>
        <label for="message">요청 메시지</label>
        <textarea id="message" placeholder="실행할 작업 내용을 입력하세요."></textarea>
      </div>

      <div class="grid-3">
        <button id="sendBtn" class="btn">워크플로 실행</button>
        <button id="cancelBtn" class="btn danger">워크플로 취소</button>
        <label class="checkline">
          <input id="enableFix" type="checkbox" checked style="width:auto;" />
          리뷰 실패 시 Codex 수정 단계 실행
        </label>
      </div>

      <div class="grid-2">
        <button id="checkRunnerBtn" class="btn ghost">러너 준비 상태 확인</button>
        <div id="runnerReadiness" class="status"></div>
      </div>
      <div id="workflowStatus" class="status"></div>
      <div class="stack">
        <h3 class="panel-title">러너 인증</h3>
        <div class="grid-2">
          <button id="openCodexLoginBtn" class="btn ghost">OpenAI API Keys 열기</button>
          <button id="startCodexDeviceBtn" class="btn secondary">Codex 기기 인증 시작</button>
        </div>
        <div class="grid-2">
          <button id="openGeminiLoginBtn" class="btn ghost">Gemini 로그인 페이지 열기</button>
          <button id="refreshAuthStatusBtn" class="btn ghost">인증 상태 새로고침</button>
        </div>
        <div class="grid-2">
          <input id="openaiApiKeyInput" type="password" placeholder="OPENAI_API_KEY (선택)" />
          <input id="geminiApiKeyInput" type="password" placeholder="GEMINI_API_KEY (선택)" />
        </div>
        <div class="grid-2">
          <button id="saveRuntimeKeysBtn" class="btn">런타임 키 저장</button>
          <label class="checkline">
            <input id="persistRuntimeKeys" type="checkbox" checked style="width:auto;" />
            러너 재시작 후에도 유지
          </label>
        </div>
        <div id="authStatus" class="status"></div>
        <div id="authLogs" class="panel-content"></div>
      </div>
      <div>
        <h3 class="panel-title">스트림 로그</h3>
        <div id="logs" class="logs"></div>
      </div>

      <div class="panel-grid">
        <div><h3 class="panel-title">계획</h3><div id="panel-plan" class="panel-content"></div></div>
        <div><h3 class="panel-title">작업 목록</h3><div id="panel-tasks" class="panel-content"></div></div>
        <div><h3 class="panel-title">패치</h3><div id="panel-patch" class="panel-content"></div></div>
        <div><h3 class="panel-title">리뷰</h3><div id="panel-review" class="panel-content"></div></div>
        <div><h3 class="panel-title">파일 변경</h3><div id="panel-files" class="panel-content"></div></div>
        <div><h3 class="panel-title">Git 상태</h3><div id="panel-git" class="panel-content"></div></div>
      </div>
    </section>

    <section class="stack">
      <section class="card stack">
        <h2 class="title">프로젝트 설정</h2>
        <div id="settingsStatus" class="status"></div>

        <div class="grid-2">
          <button id="loadSettingsBtn" class="btn ghost">설정 불러오기</button>
          <button id="createProjectBtn" class="btn secondary">프로젝트 생성</button>
        </div>

        <div>
          <label for="projectTitle">프로젝트 제목</label>
          <input id="projectTitle" placeholder="프로젝트 제목 입력" />
        </div>

        <div class="grid-2">
          <div>
            <label for="defaultSessionId">기본 세션 ID</label>
            <input id="defaultSessionId" />
          </div>
          <div>
            <label for="defaultCwdRelative">기본 작업 경로</label>
            <input id="defaultCwdRelative" value="." />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="writePolicy">쓰기 정책</label>
            <select id="writePolicy">
              <option value="read_only">읽기 전용 (read_only)</option>
              <option value="write_enabled">쓰기 허용 (write_enabled)</option>
            </select>
          </div>
          <label class="checkline">
            <input id="defaultEnableFix" type="checkbox" checked style="width:auto;" />
            기본값: 수정 단계 사용
          </label>
        </div>

        <div>
          <label for="codexCmdTemplate">Codex 명령 템플릿</label>
          <input id="codexCmdTemplate" placeholder="비우면 러너 기본값 사용" />
        </div>
        <div>
          <label for="geminiCmdTemplate">Gemini 명령 템플릿</label>
          <input id="geminiCmdTemplate" placeholder="비우면 러너 기본값 사용" />
        </div>

        <button id="saveSettingsBtn" class="btn">설정 저장</button>

        <h3 class="panel-title">RAG 지식 베이스 (Step 1)</h3>
        <div class="grid-2">
          <input id="ragDocTitle" placeholder="문서 제목 (선택)" />
          <input id="ragDocTags" placeholder="태그 (쉼표 구분, 선택)" />
        </div>
        <div class="grid-2">
          <textarea id="ragDocContent" placeholder="인제스트할 텍스트를 붙여넣으세요. (파일 경로 입력 시 선택)"></textarea>
          <div class="stack">
            <input id="ragSourcePath" placeholder="또는 소스 파일 경로 (예: docs/README.md)" />
            <button id="ingestRagDocBtn" class="btn secondary">RAG 문서 인제스트</button>
            <label class="checkline">
              <input id="includeRagInChat" type="checkbox" checked style="width:auto;" />
              워크플로에 RAG 컨텍스트 포함
            </label>
            <input id="ragTopK" type="number" min="1" max="20" value="4" />
          </div>
        </div>
        <div class="grid-2">
          <input id="ragQuery" placeholder="RAG 검색어 입력" />
          <button id="searchRagBtn" class="btn ghost">RAG 검색</button>
        </div>
        <div id="ragStatus" class="status"></div>
        <h3 class="panel-title">RAG 문서 목록</h3>
        <div id="ragDocs" class="panel-content"></div>
        <h3 class="panel-title">RAG 검색 결과 / 컨텍스트</h3>
        <div id="ragHits" class="panel-content"></div>

        <h3 class="panel-title">프로젝트 목록</h3>
        <div id="projectList" class="project-list"></div>

        <button id="refreshRoomLogsBtn" class="btn ghost">채팅방 로그 새로고침</button>
        <h3 class="panel-title">실행 이력</h3>
        <div id="runHistory" class="panel-content"></div>
        <h3 class="panel-title">대화 이력</h3>
        <div id="conversationHistory" class="panel-content"></div>
      </section>

      <section class="card stack">
        <h2 class="title">파일 브라우저</h2>
        <div class="grid-2">
          <input id="browsePath" value="." />
          <button id="refreshFiles" class="btn secondary">새로고침</button>
        </div>
        <div id="filesList" class="files-list"></div>
        <div>
          <h3 class="panel-title">파일 내용</h3>
          <div id="filePath" class="status"></div>
          <div id="fileContent" class="file-content"></div>
        </div>
      </section>
    </section>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const logs = el("logs");
    const workflowStatus = el("workflowStatus");
    const runnerReadiness = el("runnerReadiness");
    const authStatus = el("authStatus");
    const authLogs = el("authLogs");
    const settingsStatus = el("settingsStatus");
    const runHistory = el("runHistory");
    const conversationHistory = el("conversationHistory");
    const ragStatus = el("ragStatus");
    const ragDocs = el("ragDocs");
    const ragHits = el("ragHits");
    let currentWorkflowJobId = null;
    let source = null;
    let runnerReady = false;
    let authUrls = {};
    let authSource = null;

    const panels = {
      plan: el("panel-plan"),
      tasks: el("panel-tasks"),
      patch: el("panel-patch"),
      review: el("panel-review"),
      files: el("panel-files"),
      git: el("panel-git"),
      implement: el("panel-patch"),
      fix: el("panel-patch")
    };

    function setStatus(node, message) {
      node.textContent = message;
    }

    function appendLog(line) {
      logs.textContent += line + "\n";
      logs.scrollTop = logs.scrollHeight;
    }

    function appendAuthLog(line) {
      authLogs.textContent += line + "\n";
      authLogs.scrollTop = authLogs.scrollHeight;
    }

    function clearWorkflowView() {
      logs.textContent = "";
      Object.values(panels).forEach((node) => { node.textContent = ""; });
    }

    async function apiJson(url, options = {}) {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      const text = await res.text();
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch { data = { raw: text }; }
      }
      if (!res.ok) {
        const detail = data.detail || data.raw || `${res.status}`;
        throw new Error(String(detail));
      }
      return data;
    }

    function applySettings(settings) {
      el("projectId").value = settings.project_id;
      el("projectTitle").value = settings.title || "";
      el("defaultSessionId").value = settings.default_session_id;
      el("defaultCwdRelative").value = settings.default_cwd_relative;
      el("defaultEnableFix").checked = !!settings.default_enable_fix;
      el("codexCmdTemplate").value = settings.codex_cmd_template || "";
      el("geminiCmdTemplate").value = settings.gemini_cmd_template || "";
      el("writePolicy").value = settings.write_policy || "read_only";

      el("sessionId").value = settings.default_session_id;
      el("cwdRelative").value = settings.default_cwd_relative;
      el("enableFix").checked = !!settings.default_enable_fix;
    }

    async function refreshProjects() {
      try {
        const data = await apiJson("/api/projects");
        const list = el("projectList");
        list.textContent = "";
        for (const item of (data.items || [])) {
          const row = document.createElement("div");
          row.className = "project-row";
          row.innerHTML = `<span>${item.project_id}</span><span class="muted">${item.updated_at}</span>`;
          row.onclick = async () => {
            el("projectId").value = item.project_id;
            await loadSettings();
          };
          list.appendChild(row);
        }
      } catch (err) {
        setStatus(settingsStatus, `프로젝트 목록 불러오기 실패: ${String(err.message || err)}`);
      }
    }

    function summarizeRunnerIssues(issues) {
      if (!Array.isArray(issues) || issues.length === 0) return "";
      return issues.slice(0, 4).map((issue) => {
        const msg = (issue && issue.message) ? issue.message : "알 수 없는 이슈";
        const action = (issue && issue.action) ? ` -> ${issue.action}` : "";
        return `${msg}${action}`;
      }).join(" | ");
    }

    async function refreshRunnerReadiness() {
      const cwd = el("cwdRelative").value.trim() || ".";
      try {
        const data = await apiJson(`/api/runner/preflight?cwd_relative=${encodeURIComponent(cwd)}`);
        if (data.ready) {
          runnerReady = true;
          setStatus(runnerReadiness, "러너 준비 완료 (CLI/인증/Git 점검 통과)");
          return true;
        }
        runnerReady = false;
        const detail = summarizeRunnerIssues(data.issues);
        setStatus(runnerReadiness, `러너 준비 미완료: ${detail}`);
        return false;
      } catch (err) {
        runnerReady = false;
        setStatus(runnerReadiness, `러너 사전 점검 실패: ${String(err.message || err)}`);
        return false;
      }
    }

    async function loadAuthUrls() {
      try {
        authUrls = await apiJson("/api/runner/auth/urls");
        return authUrls;
      } catch (err) {
        setStatus(authStatus, `인증 URL 조회 실패: ${String(err.message || err)}`);
        return {};
      }
    }

    function openExternal(url) {
      if (!url) {
        setStatus(authStatus, "열 수 있는 인증 URL이 없습니다.");
        return;
      }
      const popup = window.open(url, "_blank", "noopener,noreferrer");
      if (!popup) {
        setStatus(authStatus, `팝업이 차단됐습니다. 수동으로 열어주세요: ${url}`);
      } else {
        setStatus(authStatus, `열림: ${url}`);
      }
    }

    async function refreshAuthRuntime() {
      try {
        const data = await apiJson("/api/runner/auth/runtime");
        const codex = data.codex || {};
        const gemini = data.gemini || {};
        setStatus(
          authStatus,
          `Codex=${codex.ready ? "준비됨" : "미준비"} (${codex.detail || "-"}) | `
          + `Gemini=${gemini.ready ? "준비됨" : "미준비"} (${gemini.detail || "-"})`
        );
        return data;
      } catch (err) {
        setStatus(authStatus, `인증 상태 조회 실패: ${String(err.message || err)}`);
        return null;
      }
    }

    async function saveRuntimeKeys() {
      const openaiValue = el("openaiApiKeyInput").value.trim();
      const geminiValue = el("geminiApiKeyInput").value.trim();
      try {
        await apiJson("/api/runner/auth/runtime-keys", {
          method: "POST",
          body: JSON.stringify({
            openai_api_key: openaiValue,
            gemini_api_key: geminiValue,
            persist: !!el("persistRuntimeKeys").checked
          })
        });
        setStatus(authStatus, "런타임 키 저장 완료");
        await refreshAuthRuntime();
        await refreshRunnerReadiness();
      } catch (err) {
        setStatus(authStatus, `런타임 키 저장 실패: ${String(err.message || err)}`);
      }
    }

    async function startCodexDeviceAuth() {
      if (authSource) {
        authSource.close();
        authSource = null;
      }
      authLogs.textContent = "";
      await loadAuthUrls();
      openExternal(authUrls.openai_api_keys_url || authUrls.codex_login_url || "");

      let data;
      try {
        data = await apiJson("/api/runner/auth/codex/device/start", {
          method: "POST",
          body: JSON.stringify({
            session_id: `runner-auth-codex-${Date.now()}`
          })
        });
      } catch (err) {
        setStatus(authStatus, `Codex 기기 인증 시작 실패: ${String(err.message || err)}`);
        return;
      }

      const jobId = data.job_id;
      setStatus(authStatus, `Codex 기기 인증 시작: ${jobId}`);
      authSource = new EventSource(`/api/runner/jobs/stream/${encodeURIComponent(jobId)}`);
      authSource.onmessage = async (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === "log") {
            appendAuthLog(`[${payload.stream}] ${payload.message}`);
            const lowered = String(payload.message || "").toLowerCase();
            if (lowered.includes("cloudflare") || lowered.includes("400 bad request")) {
              setStatus(
                authStatus,
                "Cloudflare 400으로 기기 인증이 차단되었습니다. OpenAI API Keys에서 키 발급 후 런타임 키 저장 경로를 사용하세요."
              );
            }
            const urlMatch = String(payload.message || "").match(/https?:\/\/[^\s]+/);
            if (urlMatch && urlMatch[0]) {
              appendAuthLog(`[안내] 아래 URL을 브라우저에서 여세요: ${urlMatch[0]}`);
            }
          } else {
            appendAuthLog(JSON.stringify(payload));
            if (payload.type === "meta" && payload.event === "finished") {
              const statusPayload = await apiJson(`/api/runner/jobs/${encodeURIComponent(jobId)}`);
              setStatus(authStatus, `Codex 기기 인증 종료: ${statusPayload.status} (rc=${statusPayload.return_code})`);
              authSource.close();
              authSource = null;
              await refreshAuthRuntime();
              await refreshRunnerReadiness();
            }
          }
        } catch (err) {
          appendAuthLog(`파싱 오류: ${String(err.message || err)}`);
        }
      };
      authSource.onerror = () => {
        appendAuthLog("[스트림] 인증 로그 스트림 연결 종료");
      };
    }

    function renderRuns(items) {
      const rows = (items || []).slice(0, 20).map((item) => {
        return `${item.workflow_job_id} | ${item.status} | ${item.updated_at || "-"}`;
      });
      runHistory.textContent = rows.length ? rows.join("\n") : "(실행 이력 없음)";
    }

    function renderConversation(items) {
      const rows = (items || []).slice(-40).map((item) => {
        const src = item.source || item.type || "event";
        if (item.message) {
          return `[${src}] ${item.message}`;
        }
        if (item.event) {
          return `[${src}] ${item.event}`;
        }
        return `[${src}] ${JSON.stringify(item)}`;
      });
      conversationHistory.textContent = rows.length ? rows.join("\n") : "(대화 이벤트 없음)";
    }

    function renderRagDocuments(items) {
      const rows = (items || []).slice(0, 80).map((item) => {
        const title = item.title || item.document_id;
        const source = item.source_path || item.source_type || "text";
        const chunks = item.chunk_count || 0;
        const chars = item.char_count || 0;
        return `${item.document_id} | ${title} | src=${source} | chunks=${chunks} | chars=${chars}`;
      });
      ragDocs.textContent = rows.length ? rows.join("\n") : "(RAG 문서 없음)";
    }

    function renderRagHits(hits, context) {
      const hitRows = (hits || []).map((hit, idx) => {
        return `[${idx + 1}] score=${hit.score} | ${hit.title} | ${hit.source_path || "inline-text"}\n${hit.excerpt}`;
      });
      const blocks = [];
      if (hitRows.length) {
        blocks.push(hitRows.join("\n\n"));
      }
      if (context) {
        blocks.push("---- 컨텍스트 미리보기 ----\n" + context);
      }
      ragHits.textContent = blocks.length ? blocks.join("\n\n") : "(검색 결과 없음)";
    }

    async function refreshRagDocuments() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(ragStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/rag/documents`);
        renderRagDocuments(data.items || []);
        setStatus(ragStatus, `RAG 문서 로드 완료: ${data.items ? data.items.length : 0}개`);
      } catch (err) {
        setStatus(ragStatus, `RAG 문서 로드 실패: ${String(err.message || err)}`);
      }
    }

    async function ingestRagDocument() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(ragStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      const sourcePath = el("ragSourcePath").value.trim();
      const body = {
        source_type: sourcePath ? "file" : "text",
        title: el("ragDocTitle").value.trim() || null,
        tags: el("ragDocTags").value
          .split(",")
          .map((v) => v.trim())
          .filter((v) => v.length > 0)
      };
      if (sourcePath) {
        body.source_path = sourcePath;
      } else {
        body.content = el("ragDocContent").value;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/rag/documents`, {
          method: "POST",
          body: JSON.stringify(body)
        });
        const item = data.item || {};
        setStatus(ragStatus, `RAG 문서 인제스트 완료: ${item.document_id || "-"}`);
        await refreshRagDocuments();
      } catch (err) {
        setStatus(ragStatus, `RAG 인제스트 실패: ${String(err.message || err)}`);
      }
    }

    async function searchRag() {
      const projectId = el("projectId").value.trim();
      const query = el("ragQuery").value.trim();
      if (!projectId) {
        setStatus(ragStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      if (!query) {
        setStatus(ragStatus, "RAG 검색어를 입력하세요.");
        return;
      }
      const topK = Number(el("ragTopK").value) || 4;
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/rag/search`, {
          method: "POST",
          body: JSON.stringify({ query, top_k: Math.max(1, Math.min(20, topK)), max_chars: 2400 })
        });
        renderRagHits(data.hits || [], data.context || "");
        setStatus(ragStatus, `RAG 검색 완료: ${data.hits ? data.hits.length : 0}건`);
      } catch (err) {
        setStatus(ragStatus, `RAG 검색 실패: ${String(err.message || err)}`);
      }
    }

    async function refreshRoomLogs() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      try {
        const runs = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/runs`);
        const conversation = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/conversation?limit=200`);
        renderRuns(runs.items || []);
        renderConversation(conversation.items || []);
      } catch (err) {
        setStatus(settingsStatus, `채팅방 로그 로드 실패: ${String(err.message || err)}`);
      }
    }

    async function loadSettings() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/settings`);
        applySettings(data);
        await refreshRoomLogs();
        await refreshRagDocuments();
        setStatus(settingsStatus, `설정 불러오기 완료: ${projectId}`);
      } catch (err) {
        setStatus(settingsStatus, `설정 불러오기 실패: ${String(err.message || err)}`);
      }
    }

    async function createProject() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      try {
        const data = await apiJson("/api/projects", {
          method: "POST",
          body: JSON.stringify({
            project_id: projectId,
            title: el("projectTitle").value.trim() || null
          })
        });
        applySettings(data);
        await refreshProjects();
        await refreshRoomLogs();
        await refreshRagDocuments();
        setStatus(settingsStatus, `프로젝트 생성 완료: ${projectId}`);
      } catch (err) {
        setStatus(settingsStatus, `프로젝트 생성 실패: ${String(err.message || err)}`);
      }
    }

    async function saveSettings() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/settings`, {
          method: "PUT",
          body: JSON.stringify({
            title: el("projectTitle").value.trim() || null,
            default_session_id: el("defaultSessionId").value.trim() || projectId,
            default_cwd_relative: el("defaultCwdRelative").value.trim() || ".",
            default_enable_fix: el("defaultEnableFix").checked,
            codex_cmd_template: el("codexCmdTemplate").value.trim(),
            gemini_cmd_template: el("geminiCmdTemplate").value.trim(),
            write_policy: el("writePolicy").value
          })
        });
        applySettings(data);
        await refreshProjects();
        await refreshRoomLogs();
        await refreshRagDocuments();
        setStatus(settingsStatus, `설정 저장 완료: ${projectId}`);
      } catch (err) {
        setStatus(settingsStatus, `설정 저장 실패: ${String(err.message || err)}`);
      }
    }

    async function startWorkflow() {
      if (source) {
        source.close();
        source = null;
      }
      clearWorkflowView();

      const payload = {
        project_id: el("projectId").value.trim() || null,
        session_id: el("sessionId").value.trim() || null,
        message: el("message").value,
        cwd_relative: el("cwdRelative").value.trim() || null,
        enable_fix: el("enableFix").checked,
        include_rag: el("includeRagInChat").checked,
        rag_top_k: Math.max(1, Math.min(20, Number(el("ragTopK").value) || 4))
      };

      const ready = await refreshRunnerReadiness();
      if (!ready) {
        setStatus(workflowStatus, "실행 차단: 러너 준비 상태를 먼저 통과해야 합니다. (설치/인증 확인)");
        return;
      }

      if (!payload.project_id) {
        setStatus(workflowStatus, "프로젝트 ID는 필수입니다.");
        return;
      }
      if (!payload.message || !payload.message.trim()) {
        setStatus(workflowStatus, "요청 메시지를 입력하세요.");
        return;
      }

      let data;
      try {
        data = await apiJson("/api/chat", {
          method: "POST",
          body: JSON.stringify(payload)
        });
      } catch (err) {
        setStatus(workflowStatus, `워크플로 시작 실패: ${String(err.message || err)}`);
        return;
      }

      setStatus(workflowStatus, `워크플로 시작됨: ${data.workflow_job_id} (프로젝트=${data.project_id})`);
      currentWorkflowJobId = data.workflow_job_id;
      setTimeout(() => refreshRoomLogs(), 800);
      source = new EventSource(`/api/workflow/stream/${data.workflow_job_id}`);
      source.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          handleWorkflowEvent(payload);
        } catch (err) {
          appendLog("파싱 오류: " + String(err));
        }
      };
      source.onerror = () => appendLog("[스트림] 연결이 종료되었습니다.");
    }

    function handleWorkflowEvent(evt) {
      const tag = `[${evt.seq}] ${evt.type}`;
      if (evt.type === "runner_event") {
        const p = evt.payload || {};
        if (p.type === "log") {
          appendLog(`${tag} [${evt.step}/${p.stream}] ${p.message}`);
        } else {
          appendLog(`${tag} [${evt.step}] ${JSON.stringify(p)}`);
        }
        return;
      }

      if (evt.type === "artifact") {
        appendLog(`${tag} 산출물=${evt.name}`);
        if (panels[evt.name]) {
          panels[evt.name].textContent = evt.content || "";
        }
        return;
      }

      appendLog(`${tag} ${JSON.stringify(evt)}`);
      if (evt.type === "meta" && evt.event === "finished") {
        setStatus(workflowStatus, `완료: ${evt.status}`);
        currentWorkflowJobId = null;
        if (source) { source.close(); source = null; }
      }
      if (evt.type === "meta" && evt.event === "error") {
        setStatus(workflowStatus, `실패: ${evt.message || "알 수 없는 오류"}`);
        currentWorkflowJobId = null;
        if (source) { source.close(); source = null; }
      }
      if (evt.type === "meta" && evt.event === "canceled") {
        setStatus(workflowStatus, "취소됨");
        currentWorkflowJobId = null;
        if (source) { source.close(); source = null; }
      }
    }

    async function cancelWorkflow() {
      if (!currentWorkflowJobId) {
        setStatus(workflowStatus, "현재 실행 중인 워크플로가 없습니다.");
        return;
      }
      try {
        await apiJson(`/api/workflow/${encodeURIComponent(currentWorkflowJobId)}/cancel`, { method: "POST" });
        setStatus(workflowStatus, `취소 요청 전송: ${currentWorkflowJobId}`);
      } catch (err) {
        setStatus(workflowStatus, `취소 실패: ${String(err.message || err)}`);
      }
    }

    async function refreshFiles() {
      const path = el("browsePath").value.trim() || ".";
      const list = el("filesList");
      list.textContent = "";
      try {
        const data = await apiJson(`/api/files?path=${encodeURIComponent(path)}`, { headers: {} });
        for (const entry of data.entries || []) {
          const row = document.createElement("div");
          row.className = "entry";
          row.innerHTML = `<span>${entry.path}</span><span class="type">${entry.type}</span>`;
          row.onclick = () => {
            if (entry.type === "dir") {
              el("browsePath").value = entry.path;
              refreshFiles();
            } else {
              loadFile(entry.path);
            }
          };
          list.appendChild(row);
        }
      } catch (err) {
        list.textContent = String(err.message || err);
      }
    }

    async function loadFile(path) {
      try {
        const data = await apiJson(`/api/file?path=${encodeURIComponent(path)}`, { headers: {} });
        el("filePath").textContent = data.path;
        el("fileContent").textContent = data.content;
      } catch (err) {
        el("filePath").textContent = path;
        el("fileContent").textContent = String(err.message || err);
      }
    }

    el("sendBtn").onclick = () => startWorkflow();
    el("cancelBtn").onclick = () => cancelWorkflow();
    el("loadSettingsBtn").onclick = () => loadSettings();
    el("createProjectBtn").onclick = () => createProject();
    el("saveSettingsBtn").onclick = () => saveSettings();
    el("refreshRoomLogsBtn").onclick = () => refreshRoomLogs();
    el("ingestRagDocBtn").onclick = () => ingestRagDocument();
    el("searchRagBtn").onclick = () => searchRag();
    el("refreshFiles").onclick = () => refreshFiles();
    el("checkRunnerBtn").onclick = () => refreshRunnerReadiness();
    el("openCodexLoginBtn").onclick = async () => {
      await loadAuthUrls();
      openExternal(authUrls.openai_api_keys_url || authUrls.codex_login_url || "");
    };
    el("openGeminiLoginBtn").onclick = async () => {
      await loadAuthUrls();
      openExternal(authUrls.gemini_login_url || authUrls.gemini_api_keys_url || "");
    };
    el("refreshAuthStatusBtn").onclick = () => refreshAuthRuntime();
    el("saveRuntimeKeysBtn").onclick = () => saveRuntimeKeys();
    el("startCodexDeviceBtn").onclick = () => startCodexDeviceAuth();

    (async () => {
      await refreshProjects();
      await refreshFiles();
      await loadSettings();
      await refreshRoomLogs();
      await refreshRagDocuments();
      await loadAuthUrls();
      await refreshAuthRuntime();
      await refreshRunnerReadiness();
    })();
  </script>
</body>
</html>
