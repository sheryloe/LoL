<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LoL Orchestrator</title>
  <style>
    :root {
      --bg: #f3f0e9;
      --surface: #fffdf8;
      --ink: #1f2328;
      --muted: #6a6f76;
      --line: #d8d2c6;
      --accent: #0c6b58;
      --accent-2: #f0a84b;
      --danger: #a12b2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans KR", "Pretendard", sans-serif;
      background: radial-gradient(circle at top right, #fce9cf 0%, var(--bg) 35%, #ebe5d9 100%);
      color: var(--ink);
    }
    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .title {
      margin: 0 0 10px 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .subtitle {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .stack { display: grid; gap: 10px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
    input, textarea, button, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.secondary { background: #2f4a3f; }
    .btn.ghost {
      background: #f7f3eb;
      color: #2f4a3f;
      border: 1px solid var(--line);
    }
    .btn.danger { background: var(--danger); }
    .status {
      font-size: 12px;
      color: var(--muted);
      min-height: 20px;
      border-left: 3px solid var(--accent-2);
      padding-left: 8px;
    }
    .logs, .panel-content, .file-content {
      background: #faf8f3;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      white-space: pre-wrap;
      font-family: "Cascadia Code", "Consolas", monospace;
      font-size: 12px;
      overflow: auto;
    }
    .logs { min-height: 260px; max-height: 360px; }
    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .panel-title {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #36414a;
      border-left: 4px solid var(--accent-2);
      padding-left: 6px;
    }
    .panel-content {
      min-height: 100px;
      max-height: 220px;
    }
    .project-list {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #faf8f3;
      max-height: 200px;
      overflow: auto;
    }
    .project-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #e9e3d7;
      cursor: pointer;
      font-size: 12px;
    }
    .project-row:last-child { border-bottom: none; }
    .project-row:hover { background: #f1ebdf; }
    .project-row .muted { color: var(--muted); }
    .files-list {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #faf8f3;
      max-height: 220px;
      overflow: auto;
    }
    .entry {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid #e9e3d7;
      cursor: pointer;
      font-size: 12px;
    }
    .entry:hover { background: #f1ebdf; }
    .entry:last-child { border-bottom: none; }
    .entry .type { color: var(--muted); }
    .file-content { min-height: 180px; max-height: 320px; }
    @media (max-width: 1080px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card stack">
      <h1 class="title">Workflow Console</h1>
      <p class="subtitle">채팅방 = 프로젝트 단위로 워크플로를 실행합니다.</p>

      <div class="grid-3">
        <div>
          <label for="projectId">Project ID (Room ID)</label>
          <input id="projectId" value="room-main" />
        </div>
        <div>
          <label for="sessionId">Session ID</label>
          <input id="sessionId" value="room-main" />
        </div>
        <div>
          <label for="cwdRelative">CWD relative</label>
          <input id="cwdRelative" value="." />
        </div>
      </div>

      <div>
        <label for="message">Prompt</label>
        <textarea id="message" placeholder="요청을 입력하세요."></textarea>
      </div>

      <div class="grid-3">
        <button id="sendBtn" class="btn">Run Workflow</button>
        <button id="cancelBtn" class="btn danger">Cancel Workflow</button>
        <label style="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;">
          <input id="enableFix" type="checkbox" checked style="width:auto;" />
          Review FAIL 시 Codex Fix 실행
        </label>
      </div>

      <div class="grid-2">
        <button id="checkRunnerBtn" class="btn ghost">Check Runner Readiness</button>
        <div id="runnerReadiness" class="status"></div>
      </div>
      <div id="workflowStatus" class="status"></div>
      <div class="stack">
        <h3 class="panel-title">Runner Auth</h3>
        <div class="grid-2">
          <button id="openCodexLoginBtn" class="btn ghost">Open OpenAI API Keys</button>
          <button id="startCodexDeviceBtn" class="btn secondary">Start Codex Device Auth</button>
        </div>
        <div class="grid-2">
          <button id="openGeminiLoginBtn" class="btn ghost">Open Gemini Login Page</button>
          <button id="refreshAuthStatusBtn" class="btn ghost">Refresh Auth Status</button>
        </div>
        <div class="grid-2">
          <input id="openaiApiKeyInput" type="password" placeholder="OPENAI_API_KEY (optional)" />
          <input id="geminiApiKeyInput" type="password" placeholder="GEMINI_API_KEY (optional)" />
        </div>
        <div class="grid-2">
          <button id="saveRuntimeKeysBtn" class="btn">Save Runtime Keys</button>
          <label style="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;">
            <input id="persistRuntimeKeys" type="checkbox" checked style="width:auto;" />
            persist in runner
          </label>
        </div>
        <div id="authStatus" class="status"></div>
        <div id="authLogs" class="panel-content"></div>
      </div>
      <div>
        <h3 class="panel-title">Stream Logs</h3>
        <div id="logs" class="logs"></div>
      </div>

      <div class="panel-grid">
        <div><h3 class="panel-title">Plan</h3><div id="panel-plan" class="panel-content"></div></div>
        <div><h3 class="panel-title">Tasks</h3><div id="panel-tasks" class="panel-content"></div></div>
        <div><h3 class="panel-title">Patch</h3><div id="panel-patch" class="panel-content"></div></div>
        <div><h3 class="panel-title">Review</h3><div id="panel-review" class="panel-content"></div></div>
        <div><h3 class="panel-title">Files</h3><div id="panel-files" class="panel-content"></div></div>
        <div><h3 class="panel-title">Git</h3><div id="panel-git" class="panel-content"></div></div>
      </div>
    </section>

    <section class="stack">
      <section class="card stack">
        <h2 class="title">Project Settings</h2>
        <div id="settingsStatus" class="status"></div>

        <div class="grid-2">
          <button id="loadSettingsBtn" class="btn ghost">Load Settings</button>
          <button id="createProjectBtn" class="btn secondary">Create Project</button>
        </div>

        <div>
          <label for="projectTitle">Title</label>
          <input id="projectTitle" placeholder="프로젝트 제목" />
        </div>

        <div class="grid-2">
          <div>
            <label for="defaultSessionId">Default Session ID</label>
            <input id="defaultSessionId" />
          </div>
          <div>
            <label for="defaultCwdRelative">Default CWD</label>
            <input id="defaultCwdRelative" value="." />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="writePolicy">Write Policy</label>
            <select id="writePolicy">
              <option value="read_only">read_only</option>
              <option value="write_enabled">write_enabled</option>
            </select>
          </div>
          <label style="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;">
            <input id="defaultEnableFix" type="checkbox" checked style="width:auto;" />
            default enable_fix
          </label>
        </div>

        <div>
          <label for="codexCmdTemplate">Codex CMD Template</label>
          <input id="codexCmdTemplate" placeholder="(empty = runner default)" />
        </div>
        <div>
          <label for="geminiCmdTemplate">Gemini CMD Template</label>
          <input id="geminiCmdTemplate" placeholder="(empty = runner default)" />
        </div>

        <button id="saveSettingsBtn" class="btn">Save Settings</button>

        <h3 class="panel-title">RAG Knowledge Base (Step 1)</h3>
        <div class="grid-2">
          <input id="ragDocTitle" placeholder="Document title (optional)" />
          <input id="ragDocTags" placeholder="tags comma separated (optional)" />
        </div>
        <div class="grid-2">
          <textarea id="ragDocContent" placeholder="Paste text to ingest (optional if source path is set)"></textarea>
          <div class="stack">
            <input id="ragSourcePath" placeholder="or source file path (e.g. docs/README.md)" />
            <button id="ingestRagDocBtn" class="btn secondary">Ingest RAG Document</button>
            <label style="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;">
              <input id="includeRagInChat" type="checkbox" checked style="width:auto;" />
              include RAG context in workflow
            </label>
            <input id="ragTopK" type="number" min="1" max="20" value="4" />
          </div>
        </div>
        <div class="grid-2">
          <input id="ragQuery" placeholder="RAG query for preview/search" />
          <button id="searchRagBtn" class="btn ghost">Search RAG</button>
        </div>
        <div id="ragStatus" class="status"></div>
        <h3 class="panel-title">RAG Documents</h3>
        <div id="ragDocs" class="panel-content"></div>
        <h3 class="panel-title">RAG Search Hits / Context</h3>
        <div id="ragHits" class="panel-content"></div>

        <h3 class="panel-title">Projects</h3>
        <div id="projectList" class="project-list"></div>

        <button id="refreshRoomLogsBtn" class="btn ghost">Refresh Room Logs</button>
        <h3 class="panel-title">Run History</h3>
        <div id="runHistory" class="panel-content"></div>
        <h3 class="panel-title">Conversation History</h3>
        <div id="conversationHistory" class="panel-content"></div>
      </section>

      <section class="card stack">
        <h2 class="title">File Browser</h2>
        <div class="grid-2">
          <input id="browsePath" value="." />
          <button id="refreshFiles" class="btn secondary">Refresh</button>
        </div>
        <div id="filesList" class="files-list"></div>
        <div>
          <h3 class="panel-title">File Content</h3>
          <div id="filePath" class="status"></div>
          <div id="fileContent" class="file-content"></div>
        </div>
      </section>
    </section>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const logs = el("logs");
    const workflowStatus = el("workflowStatus");
    const runnerReadiness = el("runnerReadiness");
    const authStatus = el("authStatus");
    const authLogs = el("authLogs");
    const settingsStatus = el("settingsStatus");
    const runHistory = el("runHistory");
    const conversationHistory = el("conversationHistory");
    const ragStatus = el("ragStatus");
    const ragDocs = el("ragDocs");
    const ragHits = el("ragHits");
    let currentWorkflowJobId = null;
    let source = null;
    let runnerReady = false;
    let authUrls = {};
    let authSource = null;

    const panels = {
      plan: el("panel-plan"),
      tasks: el("panel-tasks"),
      patch: el("panel-patch"),
      review: el("panel-review"),
      files: el("panel-files"),
      git: el("panel-git"),
      implement: el("panel-patch"),
      fix: el("panel-patch")
    };

    function setStatus(node, message) {
      node.textContent = message;
    }

    function appendLog(line) {
      logs.textContent += line + "\n";
      logs.scrollTop = logs.scrollHeight;
    }

    function appendAuthLog(line) {
      authLogs.textContent += line + "\n";
      authLogs.scrollTop = authLogs.scrollHeight;
    }

    function clearWorkflowView() {
      logs.textContent = "";
      Object.values(panels).forEach((node) => { node.textContent = ""; });
    }

    async function apiJson(url, options = {}) {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      const text = await res.text();
      let data = {};
      if (text) {
        try { data = JSON.parse(text); } catch { data = { raw: text }; }
      }
      if (!res.ok) {
        const detail = data.detail || data.raw || `${res.status}`;
        throw new Error(String(detail));
      }
      return data;
    }

    function applySettings(settings) {
      el("projectId").value = settings.project_id;
      el("projectTitle").value = settings.title || "";
      el("defaultSessionId").value = settings.default_session_id;
      el("defaultCwdRelative").value = settings.default_cwd_relative;
      el("defaultEnableFix").checked = !!settings.default_enable_fix;
      el("codexCmdTemplate").value = settings.codex_cmd_template || "";
      el("geminiCmdTemplate").value = settings.gemini_cmd_template || "";
      el("writePolicy").value = settings.write_policy || "read_only";

      el("sessionId").value = settings.default_session_id;
      el("cwdRelative").value = settings.default_cwd_relative;
      el("enableFix").checked = !!settings.default_enable_fix;
    }

    async function refreshProjects() {
      try {
        const data = await apiJson("/api/projects");
        const list = el("projectList");
        list.textContent = "";
        for (const item of (data.items || [])) {
          const row = document.createElement("div");
          row.className = "project-row";
          row.innerHTML = `<span>${item.project_id}</span><span class="muted">${item.updated_at}</span>`;
          row.onclick = async () => {
            el("projectId").value = item.project_id;
            await loadSettings();
          };
          list.appendChild(row);
        }
      } catch (err) {
        setStatus(settingsStatus, `projects load failed: ${String(err.message || err)}`);
      }
    }

    function summarizeRunnerIssues(issues) {
      if (!Array.isArray(issues) || issues.length === 0) return "";
      return issues.slice(0, 4).map((issue) => {
        const msg = (issue && issue.message) ? issue.message : "unknown issue";
        const action = (issue && issue.action) ? ` -> ${issue.action}` : "";
        return `${msg}${action}`;
      }).join(" | ");
    }

    async function refreshRunnerReadiness() {
      const cwd = el("cwdRelative").value.trim() || ".";
      try {
        const data = await apiJson(`/api/runner/preflight?cwd_relative=${encodeURIComponent(cwd)}`);
        if (data.ready) {
          runnerReady = true;
          setStatus(runnerReadiness, "runner ready (CLI/auth/git checks passed)");
          return true;
        }
        runnerReady = false;
        const detail = summarizeRunnerIssues(data.issues);
        setStatus(runnerReadiness, `runner NOT ready: ${detail}`);
        return false;
      } catch (err) {
        runnerReady = false;
        setStatus(runnerReadiness, `runner preflight failed: ${String(err.message || err)}`);
        return false;
      }
    }

    async function loadAuthUrls() {
      try {
        authUrls = await apiJson("/api/runner/auth/urls");
        return authUrls;
      } catch (err) {
        setStatus(authStatus, `auth url load failed: ${String(err.message || err)}`);
        return {};
      }
    }

    function openExternal(url) {
      if (!url) {
        setStatus(authStatus, "auth url is not available");
        return;
      }
      const popup = window.open(url, "_blank", "noopener,noreferrer");
      if (!popup) {
        setStatus(authStatus, `popup blocked. open manually: ${url}`);
      } else {
        setStatus(authStatus, `opened: ${url}`);
      }
    }

    async function refreshAuthRuntime() {
      try {
        const data = await apiJson("/api/runner/auth/runtime");
        const codex = data.codex || {};
        const gemini = data.gemini || {};
        setStatus(
          authStatus,
          `codex=${codex.ready ? "ready" : "not_ready"} (${codex.detail || "-"}) | `
          + `gemini=${gemini.ready ? "ready" : "not_ready"} (${gemini.detail || "-"})`
        );
        return data;
      } catch (err) {
        setStatus(authStatus, `auth status failed: ${String(err.message || err)}`);
        return null;
      }
    }

    async function saveRuntimeKeys() {
      const openaiValue = el("openaiApiKeyInput").value.trim();
      const geminiValue = el("geminiApiKeyInput").value.trim();
      try {
        await apiJson("/api/runner/auth/runtime-keys", {
          method: "POST",
          body: JSON.stringify({
            openai_api_key: openaiValue,
            gemini_api_key: geminiValue,
            persist: !!el("persistRuntimeKeys").checked
          })
        });
        setStatus(authStatus, "runtime keys updated");
        await refreshAuthRuntime();
        await refreshRunnerReadiness();
      } catch (err) {
        setStatus(authStatus, `set runtime keys failed: ${String(err.message || err)}`);
      }
    }

    async function startCodexDeviceAuth() {
      if (authSource) {
        authSource.close();
        authSource = null;
      }
      authLogs.textContent = "";
      await loadAuthUrls();
      openExternal(authUrls.openai_api_keys_url || authUrls.codex_login_url || "");

      let data;
      try {
        data = await apiJson("/api/runner/auth/codex/device/start", {
          method: "POST",
          body: JSON.stringify({
            session_id: `runner-auth-codex-${Date.now()}`
          })
        });
      } catch (err) {
        setStatus(authStatus, `start codex device auth failed: ${String(err.message || err)}`);
        return;
      }

      const jobId = data.job_id;
      setStatus(authStatus, `codex device auth started: ${jobId}`);
      authSource = new EventSource(`/api/runner/jobs/stream/${encodeURIComponent(jobId)}`);
      authSource.onmessage = async (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === "log") {
            appendAuthLog(`[${payload.stream}] ${payload.message}`);
            const lowered = String(payload.message || "").toLowerCase();
            if (lowered.includes("cloudflare") || lowered.includes("400 bad request")) {
              setStatus(
                authStatus,
                "device auth blocked (cloudflare). use OpenAI API key page + Save Runtime Keys flow."
              );
            }
            const urlMatch = String(payload.message || "").match(/https?:\/\/[^\s]+/);
            if (urlMatch && urlMatch[0]) {
              appendAuthLog(`[hint] open this url: ${urlMatch[0]}`);
            }
          } else {
            appendAuthLog(JSON.stringify(payload));
            if (payload.type === "meta" && payload.event === "finished") {
              const statusPayload = await apiJson(`/api/runner/jobs/${encodeURIComponent(jobId)}`);
              setStatus(authStatus, `codex device auth finished: ${statusPayload.status} (rc=${statusPayload.return_code})`);
              authSource.close();
              authSource = null;
              await refreshAuthRuntime();
              await refreshRunnerReadiness();
            }
          }
        } catch (err) {
          appendAuthLog(`parse error: ${String(err.message || err)}`);
        }
      };
      authSource.onerror = () => {
        appendAuthLog("[stream] auth stream disconnected");
      };
    }

    function renderRuns(items) {
      const rows = (items || []).slice(0, 20).map((item) => {
        return `${item.workflow_job_id} | ${item.status} | ${item.updated_at || "-"}`;
      });
      runHistory.textContent = rows.length ? rows.join("\n") : "(no runs)";
    }

    function renderConversation(items) {
      const rows = (items || []).slice(-40).map((item) => {
        const src = item.source || item.type || "event";
        if (item.message) {
          return `[${src}] ${item.message}`;
        }
        if (item.event) {
          return `[${src}] ${item.event}`;
        }
        return `[${src}] ${JSON.stringify(item)}`;
      });
      conversationHistory.textContent = rows.length ? rows.join("\n") : "(no conversation events)";
    }

    function renderRagDocuments(items) {
      const rows = (items || []).slice(0, 80).map((item) => {
        const title = item.title || item.document_id;
        const source = item.source_path || item.source_type || "text";
        const chunks = item.chunk_count || 0;
        const chars = item.char_count || 0;
        return `${item.document_id} | ${title} | src=${source} | chunks=${chunks} | chars=${chars}`;
      });
      ragDocs.textContent = rows.length ? rows.join("\n") : "(no RAG documents)";
    }

    function renderRagHits(hits, context) {
      const hitRows = (hits || []).map((hit, idx) => {
        return `[${idx + 1}] score=${hit.score} | ${hit.title} | ${hit.source_path || "inline-text"}\n${hit.excerpt}`;
      });
      const blocks = [];
      if (hitRows.length) {
        blocks.push(hitRows.join("\n\n"));
      }
      if (context) {
        blocks.push("---- context preview ----\n" + context);
      }
      ragHits.textContent = blocks.length ? blocks.join("\n\n") : "(no hits)";
    }

    async function refreshRagDocuments() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(ragStatus, "project_id is required");
        return;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/rag/documents`);
        renderRagDocuments(data.items || []);
        setStatus(ragStatus, `RAG docs loaded: ${data.items ? data.items.length : 0}`);
      } catch (err) {
        setStatus(ragStatus, `RAG docs load failed: ${String(err.message || err)}`);
      }
    }

    async function ingestRagDocument() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(ragStatus, "project_id is required");
        return;
      }
      const sourcePath = el("ragSourcePath").value.trim();
      const body = {
        source_type: sourcePath ? "file" : "text",
        title: el("ragDocTitle").value.trim() || null,
        tags: el("ragDocTags").value
          .split(",")
          .map((v) => v.trim())
          .filter((v) => v.length > 0)
      };
      if (sourcePath) {
        body.source_path = sourcePath;
      } else {
        body.content = el("ragDocContent").value;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/rag/documents`, {
          method: "POST",
          body: JSON.stringify(body)
        });
        const item = data.item || {};
        setStatus(ragStatus, `RAG document ingested: ${item.document_id || "-"}`);
        await refreshRagDocuments();
      } catch (err) {
        setStatus(ragStatus, `RAG ingest failed: ${String(err.message || err)}`);
      }
    }

    async function searchRag() {
      const projectId = el("projectId").value.trim();
      const query = el("ragQuery").value.trim();
      if (!projectId) {
        setStatus(ragStatus, "project_id is required");
        return;
      }
      if (!query) {
        setStatus(ragStatus, "RAG query is required");
        return;
      }
      const topK = Number(el("ragTopK").value) || 4;
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/rag/search`, {
          method: "POST",
          body: JSON.stringify({ query, top_k: Math.max(1, Math.min(20, topK)), max_chars: 2400 })
        });
        renderRagHits(data.hits || [], data.context || "");
        setStatus(ragStatus, `RAG search done: ${data.hits ? data.hits.length : 0} hits`);
      } catch (err) {
        setStatus(ragStatus, `RAG search failed: ${String(err.message || err)}`);
      }
    }

    async function refreshRoomLogs() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "project_id is required");
        return;
      }
      try {
        const runs = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/runs`);
        const conversation = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/conversation?limit=200`);
        renderRuns(runs.items || []);
        renderConversation(conversation.items || []);
      } catch (err) {
        setStatus(settingsStatus, `room logs load failed: ${String(err.message || err)}`);
      }
    }

    async function loadSettings() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "project_id is required");
        return;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/settings`);
        applySettings(data);
        await refreshRoomLogs();
        await refreshRagDocuments();
        setStatus(settingsStatus, `loaded settings: ${projectId}`);
      } catch (err) {
        setStatus(settingsStatus, `load failed: ${String(err.message || err)}`);
      }
    }

    async function createProject() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "project_id is required");
        return;
      }
      try {
        const data = await apiJson("/api/projects", {
          method: "POST",
          body: JSON.stringify({
            project_id: projectId,
            title: el("projectTitle").value.trim() || null
          })
        });
        applySettings(data);
        await refreshProjects();
        await refreshRoomLogs();
        await refreshRagDocuments();
        setStatus(settingsStatus, `created project: ${projectId}`);
      } catch (err) {
        setStatus(settingsStatus, `create failed: ${String(err.message || err)}`);
      }
    }

    async function saveSettings() {
      const projectId = el("projectId").value.trim();
      if (!projectId) {
        setStatus(settingsStatus, "project_id is required");
        return;
      }
      try {
        const data = await apiJson(`/api/projects/${encodeURIComponent(projectId)}/settings`, {
          method: "PUT",
          body: JSON.stringify({
            title: el("projectTitle").value.trim() || null,
            default_session_id: el("defaultSessionId").value.trim() || projectId,
            default_cwd_relative: el("defaultCwdRelative").value.trim() || ".",
            default_enable_fix: el("defaultEnableFix").checked,
            codex_cmd_template: el("codexCmdTemplate").value.trim(),
            gemini_cmd_template: el("geminiCmdTemplate").value.trim(),
            write_policy: el("writePolicy").value
          })
        });
        applySettings(data);
        await refreshProjects();
        await refreshRoomLogs();
        await refreshRagDocuments();
        setStatus(settingsStatus, `saved settings: ${projectId}`);
      } catch (err) {
        setStatus(settingsStatus, `save failed: ${String(err.message || err)}`);
      }
    }

    async function startWorkflow() {
      if (source) {
        source.close();
        source = null;
      }
      clearWorkflowView();

      const payload = {
        project_id: el("projectId").value.trim() || null,
        session_id: el("sessionId").value.trim() || null,
        message: el("message").value,
        cwd_relative: el("cwdRelative").value.trim() || null,
        enable_fix: el("enableFix").checked,
        include_rag: el("includeRagInChat").checked,
        rag_top_k: Math.max(1, Math.min(20, Number(el("ragTopK").value) || 4))
      };

      const ready = await refreshRunnerReadiness();
      if (!ready) {
        setStatus(workflowStatus, "workflow start blocked: runner is not ready (install/auth first).");
        return;
      }

      if (!payload.project_id) {
        setStatus(workflowStatus, "project_id is required");
        return;
      }
      if (!payload.message || !payload.message.trim()) {
        setStatus(workflowStatus, "message is required");
        return;
      }

      let data;
      try {
        data = await apiJson("/api/chat", {
          method: "POST",
          body: JSON.stringify(payload)
        });
      } catch (err) {
        setStatus(workflowStatus, `workflow start failed: ${String(err.message || err)}`);
        return;
      }

      setStatus(workflowStatus, `workflow_job_id=${data.workflow_job_id} (project=${data.project_id})`);
      currentWorkflowJobId = data.workflow_job_id;
      setTimeout(() => refreshRoomLogs(), 800);
      source = new EventSource(`/api/workflow/stream/${data.workflow_job_id}`);
      source.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          handleWorkflowEvent(payload);
        } catch (err) {
          appendLog("parse error: " + String(err));
        }
      };
      source.onerror = () => appendLog("[stream] disconnected");
    }

    function handleWorkflowEvent(evt) {
      const tag = `[${evt.seq}] ${evt.type}`;
      if (evt.type === "runner_event") {
        const p = evt.payload || {};
        if (p.type === "log") {
          appendLog(`${tag} [${evt.step}/${p.stream}] ${p.message}`);
        } else {
          appendLog(`${tag} [${evt.step}] ${JSON.stringify(p)}`);
        }
        return;
      }

      if (evt.type === "artifact") {
        appendLog(`${tag} artifact=${evt.name}`);
        if (panels[evt.name]) {
          panels[evt.name].textContent = evt.content || "";
        }
        return;
      }

      appendLog(`${tag} ${JSON.stringify(evt)}`);
      if (evt.type === "meta" && evt.event === "finished") {
        setStatus(workflowStatus, `completed: ${evt.status}`);
        currentWorkflowJobId = null;
        if (source) { source.close(); source = null; }
      }
      if (evt.type === "meta" && evt.event === "error") {
        setStatus(workflowStatus, `failed: ${evt.message || "unknown"}`);
        currentWorkflowJobId = null;
        if (source) { source.close(); source = null; }
      }
      if (evt.type === "meta" && evt.event === "canceled") {
        setStatus(workflowStatus, "canceled");
        currentWorkflowJobId = null;
        if (source) { source.close(); source = null; }
      }
    }

    async function cancelWorkflow() {
      if (!currentWorkflowJobId) {
        setStatus(workflowStatus, "no running workflow");
        return;
      }
      try {
        await apiJson(`/api/workflow/${encodeURIComponent(currentWorkflowJobId)}/cancel`, { method: "POST" });
        setStatus(workflowStatus, `cancel requested: ${currentWorkflowJobId}`);
      } catch (err) {
        setStatus(workflowStatus, `cancel failed: ${String(err.message || err)}`);
      }
    }

    async function refreshFiles() {
      const path = el("browsePath").value.trim() || ".";
      const list = el("filesList");
      list.textContent = "";
      try {
        const data = await apiJson(`/api/files?path=${encodeURIComponent(path)}`, { headers: {} });
        for (const entry of data.entries || []) {
          const row = document.createElement("div");
          row.className = "entry";
          row.innerHTML = `<span>${entry.path}</span><span class="type">${entry.type}</span>`;
          row.onclick = () => {
            if (entry.type === "dir") {
              el("browsePath").value = entry.path;
              refreshFiles();
            } else {
              loadFile(entry.path);
            }
          };
          list.appendChild(row);
        }
      } catch (err) {
        list.textContent = String(err.message || err);
      }
    }

    async function loadFile(path) {
      try {
        const data = await apiJson(`/api/file?path=${encodeURIComponent(path)}`, { headers: {} });
        el("filePath").textContent = data.path;
        el("fileContent").textContent = data.content;
      } catch (err) {
        el("filePath").textContent = path;
        el("fileContent").textContent = String(err.message || err);
      }
    }

    el("sendBtn").onclick = () => startWorkflow();
    el("cancelBtn").onclick = () => cancelWorkflow();
    el("loadSettingsBtn").onclick = () => loadSettings();
    el("createProjectBtn").onclick = () => createProject();
    el("saveSettingsBtn").onclick = () => saveSettings();
    el("refreshRoomLogsBtn").onclick = () => refreshRoomLogs();
    el("ingestRagDocBtn").onclick = () => ingestRagDocument();
    el("searchRagBtn").onclick = () => searchRag();
    el("refreshFiles").onclick = () => refreshFiles();
    el("checkRunnerBtn").onclick = () => refreshRunnerReadiness();
    el("openCodexLoginBtn").onclick = async () => {
      await loadAuthUrls();
      openExternal(authUrls.openai_api_keys_url || authUrls.codex_login_url || "");
    };
    el("openGeminiLoginBtn").onclick = async () => {
      await loadAuthUrls();
      openExternal(authUrls.gemini_login_url || authUrls.gemini_api_keys_url || "");
    };
    el("refreshAuthStatusBtn").onclick = () => refreshAuthRuntime();
    el("saveRuntimeKeysBtn").onclick = () => saveRuntimeKeys();
    el("startCodexDeviceBtn").onclick = () => startCodexDeviceAuth();

    (async () => {
      await refreshProjects();
      await refreshFiles();
      await loadSettings();
      await refreshRoomLogs();
      await refreshRagDocuments();
      await loadAuthUrls();
      await refreshAuthRuntime();
      await refreshRunnerReadiness();
    })();
  </script>
</body>
</html>
